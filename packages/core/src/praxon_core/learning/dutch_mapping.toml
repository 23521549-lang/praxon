# van ban, wabo_count la so lan xuat hien dem tu van ban da tai) anh xa sang cac
# hoat dong log thuc hien dung buoc do (ten NL on dinh). 'canonical' la code
# dai dien cho buoc do (su kien xay ra, khong phai buoc dang ky ngay / ghi so);
# ly do chon ghi trong note tung muc. Khai niem khong gan duoc ghi o [unmapped]
# kem ly do, KHONG bia gan.

