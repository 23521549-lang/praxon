[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxon-core"
version = "0.0.0"
description = "Lớp cá nhân hóa: bốn tầng memory kèm cổng duyệt theo mức rủi ro"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.13,<3",
    "openai>=3.46,<4",
    "jsonschema>=4.26,<5",
    # Client S3-compatible cho checkpoint (task 10.3): đẩy checkpoint sang
    # Backblaze B2. Chỉ import trong adapters/ (xem adapters/s3_store.py).
    "boto3>=1.43,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"praxon_core.repositories.migrations" = ["*.sql"]
