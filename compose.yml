# Praxon — một tệp dựng cả hệ dữ liệu cho phát triển và CI (plan con 2, task 2.1).
#
# Image đã ghim tag 0.8.7-pg16 (Postgres 16 + pgvector). Nâng tag là một thay đổi
# có chủ ý, đi qua cổng duyệt như mọi thay đổi khác (quy ước như requirements-dev.txt).
#
# Mật khẩu KHÔNG hard-code trong file này: đọc từ biến môi trường POSTGRES_PASSWORD
# (file .env, xem .env.example). Cú pháp :? khiến compose báo lỗi rõ ràng thay vì
# chạy với mật khẩu rỗng nếu quên đặt.

name: praxon

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-praxon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong file .env (copy từ .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-praxon}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
