# Mọi cổng máy của dự án, chạy trên mỗi push và mỗi pull request.
#
# Hai quy ước quan trọng:
#
# 1. Gọi mọi công cụ bằng `python -m <tên>`, không bằng binary trên PATH. Phép
#    thử ngày 3/10/2026: `mypy` trên PATH báo 1.20.2 còn `python3 -m mypy` báo
#    2.4.0; `ruff` trên PATH báo 0.15.20 còn module báo 0.16.10. Ghim phiên bản
#    mà gọi sai binary thì ghim vô nghĩa. Cổng `check_tool_versions` canh việc
#    môi trường đúng là môi trường đã ghim.
#
# 2. Mỗi bước là một cổng riêng, không gộp bằng `&&`. Gộp thì bước đầu đỏ sẽ
#    che mọi bước sau, và một lần chạy CI chỉ cho biết một lỗi.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cong-may:
    runs-on: ubuntu-latest
    services:
      # Postgres 16 + pgvector cho test tích hợp plan con 2 (cùng image với compose.yml).
      # Mật khẩu lấy từ secret CI_POSTGRES_PASSWORD (Settings → Secrets and variables
      # → Actions). DB này chỉ tồn tại trong lúc job chạy nên giá trị secret là tùy ý.
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: praxon
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d praxon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài bộ công cụ đã ghim
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Cài hai gói ở chế độ editable
        run: python -m pip install -e packages/core -e packages/platform

      - name: Cache dữ liệu BPIC 2015 (M1–M5)
        uses: actions/cache@v4
        with:
          path: ~/.cache/praxon/bpic2015
          key: bpic2015-all-6c8a04d566eef571cf0aaf7b6f70310b-f271dc579cee2c067bf2d8d2b8b45162-7fee0bd0bfb8169cb2f91f2c77d2598e-fac8a0d1d7ee074c2780bc75b9154c6a-25fbd274fa1cd1c447bab98e22816359

      - name: Lấy dữ liệu BPIC 2015 (M1–M5) cho test đo thật
        env:
          PRAXON_BPIC2015_FALLBACK_URL: ${{ vars.PRAXON_BPIC2015_FALLBACK_URL }}
        run: python -m tools.ci_fetch_bpic2015 --dataset all

      - name: Cổng — phiên bản công cụ khớp bản ghim
        run: python -m tools.check_tool_versions

      - name: Cổng — ruff check
        run: python -m ruff check .

      - name: Cổng — ruff format
        run: python -m ruff format --check .

      - name: Cổng — mypy strict
        run: python -m mypy

      - name: Cổng — ranh giới import
        run: lint-imports --config .importlinter

      - name: Cổng — biến môi trường chỉ ở settings
        run: python -m tools.check_env_access

      - name: Cổng — không có dữ liệu bên thứ ba trong kho
        run: python -m tools.check_thirdparty_data

      - name: Cổng — không trùng tên module thư viện chuẩn
        run: python -m tools.check_no_stdlib_shadowing

      - name: Cổng — giấy phép phụ thuộc của core
        run: python -m tools.check_licenses

      - name: Cổng — phép thử ranh giới, core cài và chạy một mình
        run: python -m tools.check_core_standalone

      - name: Migration cơ sở dữ liệu (plan con 2)
        env:
          PRAXON_DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/praxon
        run: python -m tools.db_migrate

      - name: Test và độ phủ
        env:
          # Biến riêng cho test tích hợp để không nhiễu test settings.
          PRAXON_TEST_DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/praxon
        run: python -m pytest --ignore=tests/perf

      - name: Cổng — hiệu năng khám phá Declare
        # Chạy riêng, không coverage: đo coverage làm chậm vòng lặp trong của
        # miner nên thời gian đo không còn phản ánh tốc độ thật (xem docstring
        # tests/perf/test_discover_perf.py). Giới hạn 30 giây giữ nguyên.
        run: python -m pytest tests/perf --no-cov

  clean-machine:
    # Phép thử "máy trống" của task 13.1 (spec dòng 31): chạy lệnh một lệnh
    # trên runner sạch, hai lần, lần hai so JSON với lần một.
    #
    # Smoke slice chạy mọi push: chứng minh ống dẫn (wrapper -> compose ->
    # eval -> run_all) chạy được từ máy sạch. Lát cắt nhỏ dùng driver BPIC
    # giả + bỏ qua trích Wabo nên không cần GPU/B2; nhưng service `model`
    # vẫn tải GGUF 5 GB (để chứng minh cả service đó) nên job này tốn
    # ~10-15 phút — đó là chi phí của phép thử, không phải lỗi.
    #
    # Full run chỉ khi có nhãn `clean-machine-full` trên PR hoặc chạy tay
    # (workflow_dispatch). Full run CHƯA bật được: chờ 11.2 đo giờ một điều
    # kiện (H1) để biết runner có đủ giờ, và 12.2 ghi JSON tham chiếu (R5)
    # + secret B2 (`PRAXON_S3_*`) mới so được với số đã ghi. Tới lúc đó chỉ
    # cần gắn nhãn / chạy tay, không sửa job này.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài bộ công cụ đã ghim
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Cài hai gói ở chế độ editable
        run: python -m pip install -e packages/core -e packages/platform

      - name: Máy trống (smoke) — lần chạy 1
        run: python -m tools.run_phase1 --smoke --out out1

      - name: Máy trống (smoke) — log khi lần chạy 1 lỗi
        if: failure()
        run: docker compose logs model llm-proxy db

      - name: Máy trống (smoke) — lần chạy 2
        run: python -m tools.run_phase1 --smoke --out out2

      - name: Máy trống (smoke) — log khi lần chạy 2 lỗi
        if: failure()
        run: docker compose logs model llm-proxy db

      - name: Máy trống (smoke) — so hai lần chạy
        run: python -m praxon_core.eval.run_all --compare out1/phase1-report.json out2/phase1-report.json

      - name: Máy trống (full) — lần chạy 1
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'clean-machine-full')
        env:
          PRAXON_S3_ENDPOINT_URL: ${{ secrets.PRAXON_S3_ENDPOINT_URL }}
          PRAXON_S3_BUCKET: ${{ secrets.PRAXON_S3_BUCKET }}
          PRAXON_S3_ACCESS_KEY_ID: ${{ secrets.PRAXON_S3_ACCESS_KEY_ID }}
          PRAXON_S3_SECRET_ACCESS_KEY: ${{ secrets.PRAXON_S3_SECRET_ACCESS_KEY }}
        run: python -m tools.run_phase1 --out out-full1

      - name: Máy trống (full) — lần chạy 2
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'clean-machine-full')
        env:
          PRAXON_S3_ENDPOINT_URL: ${{ secrets.PRAXON_S3_ENDPOINT_URL }}
          PRAXON_S3_BUCKET: ${{ secrets.PRAXON_S3_BUCKET }}
          PRAXON_S3_ACCESS_KEY_ID: ${{ secrets.PRAXON_S3_ACCESS_KEY_ID }}
          PRAXON_S3_SECRET_ACCESS_KEY: ${{ secrets.PRAXON_S3_SECRET_ACCESS_KEY }}
        run: python -m tools.run_phase1 --out out-full2

      - name: Máy trống (full) — so hai lần chạy + với JSON đã ghi của 12.2
        if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'clean-machine-full')
        run: |
          python -m praxon_core.eval.run_all --compare out-full1/phase1-report.json out-full2/phase1-report.json
          python -m praxon_core.eval.run_all --compare out-full2/phase1-report.json docs/plans/phase-1-core/ket-qua-do-bpic2015.json
